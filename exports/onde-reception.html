<!DOCTYPE html><html lang="fr" style="--a:#fb7185;--b:#f472b6;--c:#fbbf24"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#0d0e14;color:#f3f1fb;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
body:before{content:'';position:absolute;inset:0 0 45% 0;background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--a) 50%,transparent),transparent 62%),radial-gradient(100% 70% at 100% 0%,color-mix(in srgb,var(--c) 40%,transparent),transparent 62%);pointer-events:none}
.top{position:relative;padding:28px 20px 0;width:100%}
.title{font-size:26px;font-weight:700;line-height:1.15;letter-spacing:-.02em;min-height:56px;transition:opacity .3s,transform .3s}
.sub{color:#aaa5c2;font-size:15px;margin-top:6px;line-height:1.4;min-height:36px;transition:opacity .3s}
.stage{flex:1;min-height:0;display:grid;place-items:center;width:100%;position:relative;overflow:hidden}
.foot{position:relative;padding-bottom:24px}
.pct{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--a) 45%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
.lbl{color:#7d7799;font-size:16px;margin-top:2px}
.cancel{color:#aaa5c2;font:inherit;font-size:16px;background:none;border:0;padding:10px 24px;margin-top:4px;cursor:pointer}
svg{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.s{position:relative;width:320px;height:320px;display:grid;place-items:center}
.s i{position:absolute;inset:10px;border-radius:50%;border:3px solid var(--a);opacity:0;box-shadow:0 0 20px color-mix(in srgb,var(--a) 50%,transparent);animation:wv 3.2s cubic-bezier(0,0.2,0.8,1) infinite}
.s i:nth-child(1){animation-delay:0s}
.s i:nth-child(2){animation-delay:1.06s}
.s i:nth-child(3){animation-delay:2.12s}
.t{position:relative;width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 12px 40px color-mix(in srgb,var(--a) 55%,transparent)}
.t svg{width:52px;height:52px;animation:bounceArrow 1.6s ease-in-out infinite}
@keyframes wv{0%{transform:scale(0.3);opacity:0.9}60%{opacity:0.6}100%{transform:scale(1.35);opacity:0}}
@keyframes bounceArrow{0%,100%{transform:translateY(-5px)}50%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:14s!important}}
</style></head><body><div class="top"><div class="title" id="title"></div><div class="sub" id="sub"></div></div><div class="stage"><div class="s"><i></i><i></i><i></i><div class="t"><svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg></div></div></div><div class="foot"><div class="pct" id="pct">0%</div><div class="lbl" id="lbl"></div><button class="cancel">Annuler</button></div><script>window.STEPS=[["Téléchargement de ta vidéo","On récupère ta vidéo, patiente quelques secondes.","Préparation"],["Réception du fichier","La vidéo arrive sur ton téléphone.","Téléchargement"],["Presque terminé","On vérifie que le fichier est complet.","Vérification"]];var T=document.getElementById('title'),S=document.getElementById('sub'),P=document.getElementById('pct'),L=document.getElementById('lbl'),st=window.STEPS,N=3200,tot=st.length*N,t0=Date.now(),cur=-1;function show(k){T.style.opacity=0;S.style.opacity=0;T.style.transform='translateY(6px)';setTimeout(function(){T.textContent=st[k][0];S.textContent=st[k][1];L.textContent=st[k][2];T.style.opacity=1;S.style.opacity=1;T.style.transform='none'},250)}setInterval(function(){var e=(Date.now()-t0)%tot,k=Math.floor(e/N),pctVal=Math.min(100,Math.floor(e/tot*100));P.textContent=pctVal+'%';if(k!==cur){cur=k;show(k)}},100);</script></body></html>
