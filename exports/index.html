<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPS Video Agent - Agent Intelligent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-40 px-4 h-16 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="bot" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg">NPS Video Agent</h1>
                <p class="text-xs text-slate-400">Agent Autonome & Paramètres API</p>
            </div>
        </div>
    </header>
    <main class="flex-1 max-w-4xl mx-auto w-full p-6 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">
                <i data-lucide="settings" class="w-5 h-5 text-indigo-500"></i> Configuration des clés API & Token
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Token GitHub (Terminal / Dépôt)</label>
                    <input type="password" id="cfg-github" placeholder="ghp_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Clé API Gemini</label>
                    <input type="password" id="cfg-gemini" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Clé API Jina Reader</label>
                    <input type="password" id="cfg-jina" placeholder="jina_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button onclick="saveConfig()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">Enregistrer la configuration</button>
            </div>
        </div>
    </main>
    <script>
        lucide.createIcons();
        function saveConfig() {
            alert('Configuration enregistrée avec succès !');
        }
    </script>
</body>
</html>
