<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Orange - Identité IA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: linear-gradient(145deg, #161b22, #0d1117);
            border: 1px solid #30363d;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }
        .logo-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 24px auto;
            animation: pulse 3s infinite ease-in-out;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ff7b72;
            letter-spacing: 1px;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #238636;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2ea043;
        }
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 123, 114, 0.3)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 20px rgba(255, 123, 114, 0.6)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(255, 123, 114, 0.3)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
              <defs>
                <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FF8C00" />
                  <stop offset="100%" stop-color="#FF4500" />
                </linearGradient>
                <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1f1f1f" />
                  <stop offset="100%" stop-color="#0a0a0a" />
                </linearGradient>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="12" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>
              <circle cx="250" cy="250" r="230" fill="url(#darkGrad)" stroke="#FF8C00" stroke-width="4" stroke-opacity="0.4" />
              <polygon points="250,70 410,380 90,380" fill="none" stroke="url(#orangeGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)" />
              <polygon points="250,130 360,340 140,340" fill="#FF8C00" fill-opacity="0.15" stroke="#FF8C00" stroke-width="3" stroke-linejoin="round" />
              <circle cx="250" cy="265" r="35" fill="url(#orangeGrad)" filter="url(#glow)" />
              <circle cx="250" cy="265" r="15" fill="#ffffff" />
              <line x1="250" y1="70" x2="250" y2="230" stroke="#FF4500" stroke-width="4" stroke-dasharray="6 6" />
            </svg>
        </div>
        <h1>Boss Orange</h1>
        <p>Identité visuelle officielle de l'intelligence artificielle</p>
        <a href="https://github.com/nps-nelson/Boss-Orange" class="btn" target="_blank">Voir sur GitHub</a>
    </div>
</body>
</html>
