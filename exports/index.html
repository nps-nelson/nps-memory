<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPS Video Agent - Agent Intelligent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/50 p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl">N</div>
            <div>
                <h1 class="font-bold text-lg">NPS Video Agent</h1>
                <p class="text-xs text-slate-400">Agent de Téléchargement Multi-Sources</p>
            </div>
        </div>
        <button onclick="document.getElementById('modal-settings').classList.toggle('hidden')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium flex items-center space-x-2">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span>Paramètres API</span>
        </button>
    </header>
    <main class="flex-1 max-w-4xl mx-auto w-full p-6 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-xl font-bold mb-4">Télécharger une vidéo</h2>
            <div class="flex gap-3">
                <input type="text" id="url-input" placeholder="Collez le lien de la vidéo (TikTok, etc.)..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
                <button onclick="alert('Agent prêt ! Utilisez vos clés configurées.')" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 font-medium rounded-xl transition shadow-lg shadow-indigo-600/30">Lancer</button>
            </div>
        </div>
    </main>
    <div id="modal-settings" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Configuration des Clés API</h3>
                <button onclick="document.getElementById('modal-settings').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Token GitHub (Terminal / Actions)</label>
                    <input type="password" id="cfg-github" placeholder="ghp_..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Clé API Gemini</label>
                    <input type="password" id="cfg-gemini" placeholder="AIza..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Clé API Jina Reader</label>
                    <input type="password" id="cfg-jina" placeholder="jina_..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                </div>
            </div>
            <button onclick="alert('Paramètres enregistrés avec succès !'); document.getElementById('modal-settings').classList.add('hidden');" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-medium text-sm">Enregistrer</button>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
