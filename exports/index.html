<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPS Video Agent - Agent de Téléchargement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/50 p-4 flex justify-between items-center">
        <h1 class="font-bold text-lg">NPS Video Agent</h1>
        <button id="btn-settings" class="p-2 bg-slate-800 rounded-xl hover:bg-slate-700"><i data-lucide="settings"></i></button>
    </header>
    <main class="p-6 max-w-2xl mx-auto flex-1 w-full">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
            <h2 class="text-xl font-bold mb-4">Télécharger une vidéo</h2>
            <input type="text" id="url-input" placeholder="Collez l'URL de la vidéo..." class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl mb-4 text-white">
            <button id="btn-download" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold transition">Lancer le téléchargement</button>
        </div>
    </main>
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Paramètres API & Tokens</h3>
            <div class="space-y-4">
                <div><label class="text-xs text-slate-400">Token GitHub</label><input type="password" id="cfg-github" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm"></div>
                <div><label class="text-xs text-slate-400">Clé API Gemini</label><input type="password" id="cfg-gemini" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm"></div>
                <div><label class="text-xs text-slate-400">Clé API Jina</label><input type="password" id="cfg-jina" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm"></div>
            </div>
            <div class="mt-6 flex justify-end space-x-3">
                <button id="btn-close" class="px-4 py-2 bg-slate-800 rounded-xl text-sm">Fermer</button>
                <button id="btn-save" class="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-semibold">Enregistrer</button>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        const modal = document.getElementById('settings-modal');
        document.getElementById('btn-settings').onclick = () => modal.classList.remove('hidden');
        document.getElementById('btn-close').onclick = () => modal.classList.add('hidden');
        document.getElementById('btn-save').onclick = () => {
            localStorage.setItem('gh_token', document.getElementById('cfg-github').value);
            localStorage.setItem('gemini_key', document.getElementById('cfg-gemini').value);
            localStorage.setItem('jina_key', document.getElementById('cfg-jina').value);
            modal.classList.add('hidden');
            alert('Paramètres enregistrés avec succès !');
        };
    </script>
</body>
</html>
