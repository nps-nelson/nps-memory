<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>GitHub Studio</title>
<style>
  :root{
    --bg:#0d1117;
    --bg-2:#0a0d12;
    --card:#161b22;
    --card-hover:#1c2129;
    --border:#30363d;
    --text:#e6edf3;
    --text-muted:#8b949e;
    --accent:#58a6ff;
    --accent-soft:rgba(88,166,255,.12);
    --ok:#3fb950;
    --ok-soft:rgba(63,185,80,.13);
    --danger:#f85149;
    --danger-soft:rgba(248,81,73,.13);
    --warn:#d29922;
    --warn-soft:rgba(210,153,34,.13);
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 8px 24px rgba(0,0,0,.32);
    --transition:all .18s cubic-bezier(0.4, 0, 0.2, 1);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;font-size:14.5px;line-height:1.45;}
  *::-webkit-scrollbar{width:6px;height:6px;}
  *::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px;}
  *::-webkit-scrollbar-thumb:hover{background:#484f58;}
  svg{display:block;flex-shrink:0;}

  /* App bar */
  .app-bar{flex-shrink:0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.2);}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.2px;}
  .brand-ico{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(88,166,255,.2);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#3a414b;flex-shrink:0;transition:var(--transition);}
  .status-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok-soft);}
  .icon-btn,.account-btn{background:var(--bg);border:1px solid var(--border);color:var(--text-muted);width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);}
  .icon-btn:hover,.account-btn:hover{color:var(--accent);border-color:#484f58;background:var(--card-hover);transform:translateY(-1px);}
  .icon-btn.danger{color:var(--danger);border-color:rgba(248,81,73,.3);}
  .icon-btn.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}
  .icon-btn[hidden],.preview-markdown[hidden]{display:none!important;}
  .icon-btn:active,.account-btn:active{transform:scale(.95) translateY(0);}
  .icon-btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important;}
  button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .account-btn{border-radius:50%;overflow:hidden;}
  .account-btn img{width:100%;height:100%;object-fit:cover;}

  /* Screen header */
  .screen-header{flex-shrink:0;padding:12px 18px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--border);min-height:56px;}
  .back-btn{background:transparent;border:none;color:var(--text-muted);width:34px;height:34px;border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition);}
  .back-btn:hover{color:var(--text);background:var(--card);}
  .home-nav-btn{color:var(--text-muted);border:1px solid transparent;}
  .home-nav-btn:hover{color:var(--accent);border-color:var(--border);background:var(--card);}
  .screen-title-wrap{flex:1;overflow:hidden;}
  .screen-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px;}
  .screen-subtitle{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .screen-actions{display:flex;gap:8px;flex-shrink:0;}

  /* Screen body */
  .screen-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:72px;}

  .hero{text-align:center;padding:48px 20px 24px;}
  .hero-ico{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:inset 0 0 0 1px rgba(88,166,255,.2);}
  .hero h2{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-0.3px;}
  .hero p{color:var(--text-muted);font-size:13.5px;margin-bottom:24px;line-height:1.6;max-width:340px;margin-left:auto;margin-right:auto;}

  .btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:13px;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .btn:hover{background:var(--card-hover);border-color:#484f58;transform:translateY(-1px);}
  .btn:active{transform:scale(.98) translateY(0);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none;}
  .btn-block{width:100%;}
  .btn-primary{background:var(--accent);color:#0a1420;border-color:var(--accent);box-shadow:0 2px 6px rgba(88,166,255,.25);}
  .btn-primary:hover{filter:brightness(1.08);background:var(--accent);}
  .btn-secondary{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--card-hover);color:var(--text);}
  .btn-danger{background:transparent;border-color:rgba(248,81,73,.4);color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);border-color:var(--danger);}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);background:var(--card-hover);}
  .btn-sm{padding:7px 11px;font-size:12px;}
  .action-row{display:flex;gap:10px;flex-wrap:wrap;}

  .search-input{width:100%;padding:10px 14px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;transition:var(--transition);}
  .search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}

  /* Grille d'accueil mise à jour selon les consignes */
  .home-usage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px;}
  .home-usage-card{appearance:none;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;color:var(--text);cursor:pointer;min-width:0;transition:var(--transition);box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .home-usage-card:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .home-usage-card:active{transform:scale(.98) translateY(0);}
  .home-usage-card .usage-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--accent);background:var(--accent-soft);flex:none;box-shadow:inset 0 0 0 1px rgba(88,166,255,.2);}
  .home-usage-card .usage-value{font-size:18px;font-weight:750;line-height:1.2;letter-spacing:-0.3px;}
  .home-usage-card .usage-label{font-size:11.5px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}

  .list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,.1);}
  button.list-item{color:var(--text);text-align:left;width:100%;font:inherit;}
  .list-item:hover{background:var(--card-hover);border-color:#3d444d;transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.2);}
  .list-item:active{transform:scale(.99) translateY(0);}
  .li-ico{color:var(--text-muted);width:18px;height:18px;flex-shrink:0;transition:var(--transition);}
  .list-item:hover .li-ico{color:var(--accent);}
  .li-main{overflow:hidden;flex:1;}
  .li-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li-sub{font-size:12px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chevron{color:var(--text-muted);width:16px;height:16px;flex-shrink:0;}

  .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;}
  .badge-ok{color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px rgba(63,185,80,.2);}
  .badge-fail{color:var(--danger);background:var(--danger-soft);box-shadow:inset 0 0 0 1px rgba(248,81,73,.2);}
  .badge-pending{color:var(--warn);background:var(--warn-soft);box-shadow:inset 0 0 0 1px rgba(210,153,34,.2);}

  .nav-tile{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:14px;box-shadow:0 2px 6px rgba(0,0,0,.15);}
  .nav-tile:hover{border-color:var(--accent);background:var(--card-hover);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.25);}
  .nav-tile:active{transform:scale(.99) translateY(0);}
  .nav-tile .ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(88,166,255,.2);}
  .nav-tile .tt{font-size:14.5px;font-weight:700;margin-bottom:3px;letter-spacing:-0.2px;}
  .nav-tile .ts{font-size:12.5px;color:var(--text-muted);}
</style>
</head>
<body>
  <!-- Contenu principal de l'application -->
  <div class="app-bar">
    <div class="brand">
      <div class="brand-ico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </div>
      <span>GitHub Studio</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="status-dot on" id="globalStatus" title="Connecté"></div>
      <button class="account-btn" id="accountBtn" title="Compte">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="Avatar">
      </button>
    </div>
  </div>

  <div class="screen-body" id="mainBody">
    <div class="hero">
      <div class="hero-ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
      </div>
      <h2>Espace de travail GitHub</h2>
      <p>Gérez vos dépôts, codes sources, workflows et stockages en toute fluidité avec une interface professionnelle.</p>
    </div>

    <!-- Grille d'accueil avec les cartes Dépôts et Stockage modifiées -->
    <div class="home-usage-grid">
      <button class="home-usage-card" onclick="openReposScreen()">
        <div class="usage-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h12"/><path d="M6 10h12"/></svg>
        </div>
        <div>
          <div class="usage-value" id="homeRepoCount">19</div>
          <div class="usage-label">Dépôts</div>
        </div>
      </button>

      <button class="home-usage-card" onclick="openStorageScreen()">
        <div class="usage-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        </div>
        <div>
          <div class="usage-value" style="font-size:14px;padding:2px 0;">Stockage</div>
          <div class="usage-label">Ouvrir</div>
        </div>
      </button>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
      <div class="nav-tile" onclick="openReposScreen()">
        <div class="ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h12"/><path d="M6 10h12"/></svg>
        </div>
        <div>
          <div class="tt">Explorer les dépôts</div>
          <div class="ts">Visualisez et gérez l'ensemble de vos projets</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openReposScreen() {
      alert("Ouverture de l'écran des dépôts.");
    }
    function openStorageScreen() {
      alert("Ouverture de l'écran du stockage.");
    }
  </script>
</body>
</html>
