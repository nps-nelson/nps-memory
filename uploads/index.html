<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>NPS – Agent IA Autonome & Intelligent</title>
<meta name="description" content="NPS est un agent IA autonome de haut niveau doté de recherche web, vision/OCR, mémoire longue durée et exécution de code." />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1b20;--bg2:#1f2028;--bg3:#252730;--text:#e2e8f0;--accent:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;align-items:center;justify-content:center;padding:2rem}
.container{background:var(--bg2);border:1px solid var(--bg3);border-radius:1rem;padding:2.5rem;max-width:600px;width:100%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.3)}
h1{font-size:1.8rem;margin-bottom:1rem;color:#fff}
p{color:#94a3b8;margin-bottom:1.5rem;line-height:1.5}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:0.75rem 1.5rem;border-radius:0.5rem;text-decoration:none;font-weight:600;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
</style>
</head>
<body>
<div class="container">
  <h1>NPS – Agent IA Autonome & Intelligent</h1>
  <p>Votre application est prête, configurée et entièrement opérationnelle. Retrouvez l'ensemble de vos outils et interfaces interactives ci-dessous.</p>
  <a href="#" class="btn">Lancer l'espace de travail</a>
</div>
</body>
</html>
