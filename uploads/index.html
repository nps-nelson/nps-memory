<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boss Orange - Identité IA</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 140, 0, 0.2);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ff8c00;
            margin-bottom: 0.5rem;
            font-size: 2.5rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .logo-box {
            margin-bottom: 1.5rem;
            display: inline-block;
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .btn {
            display: inline-block;
            background-color: #ff8c00;
            color: #0f172a;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #ffa533;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">
            <svg width="120" height="120" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF8C00" />
                        <stop offset="100%" stop-color="#FF4500" />
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <circle cx="100" cy="100" r="90" fill="#111116" stroke="url(#orangeGrad)" stroke-width="6" filter="url(#glow)" />
                <polygon points="100,45 145,125 55,125" fill="none" stroke="url(#orangeGrad)" stroke-width="8" stroke-linejoin="round" />
                <circle cx="100" cy="95" r="16" fill="url(#orangeGrad)" />
            </svg>
        </div>
        <h1>Boss Orange</h1>
        <p>Identité visuelle officielle de l'IA</p>
        <a href="https://github.com/nps-nelson/Boss-Orange" class="btn" target="_blank">Voir sur GitHub</a>
    </div>
</body>
</html>
